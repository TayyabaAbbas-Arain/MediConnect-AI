<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Sign Up — MediConnect AI</title>
  <link rel="stylesheet" href="design-system.css">
  <style>
    .auth-section { display: flex; gap: var(--space-7); max-width: 1100px; margin: 0 auto; padding: var(--space-7) var(--space-5); flex-wrap: wrap; }
    .auth-left { flex: 1 1 380px; }
    .auth-left p.eyebrow { color: var(--color-teal-600); font-weight: 600; }
    .auth-left h1 { margin-top: var(--space-2); }
    .auth-left p.desc { margin-top: var(--space-3); max-width: 400px; }
    .auth-left img { max-width: 100%; margin-top: var(--space-6); border-radius: var(--radius-md); }
    .auth-right { flex: 1 1 420px; }
    .auth-card { max-width: 460px; }
    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="app-header">
    <div class="logo"><span class="logo-badge">+</span> MediConnect <span class="accent">AI</span></div>
    <nav class="flex items-center gap-4" style="font-size:var(--text-sm); font-weight:600; color:var(--color-navy-900);">
      <a href="index.html">Home</a>
      <a href="/how-it-works">How It Works</a>
      <a href="/find-doctor">Find Doctor</a>
      <a href="/ai-assistant">AI Assistant</a>
    </nav>
    <div class="flex items-center gap-3">
      <!-- Is page pe already Signup flow mein hain, isliye sirf Login button -->
      <a class="btn btn-outline btn-sm" href="login.html">Login</a>
    </div>
  </div>

  <div class="auth-section">
    <div class="auth-left">
      <p class="eyebrow">Join as a Patient</p>
      <h1>Create Your <span style="color:var(--color-teal-600);">Patient</span> Account</h1>
      <p class="desc">Join MediConnect AI and access smarter healthcare solutions.</p>
      <img src="https://images.unsplash.com/photo-1622253692010-333f2da6031d?w=420&h=320&fit=crop" alt="Doctor portrait">
      <!-- TODO: original image final submission ke liye -->
    </div>

    <div class="auth-right">
      <div class="card auth-card">
        <h2 class="mb-4">Patient Sign Up</h2>

        <div class="field">
          <label class="field-label">Full Name <span class="required">*</span></label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input class="input" type="text" placeholder="Enter your full name">
          </div>
        </div>

        <div class="field">
          <label class="field-label">Father Name <span class="required">*</span></label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input class="input" type="text" placeholder="Enter your father name">
          </div>
        </div>

        <div class="form-row-2">
          <div class="field">
            <label class="field-label">Age <span class="required">*</span></label>
            <input class="input" type="number" placeholder="Enter your age">
          </div>
          <div class="field">
            <label class="field-label">Gender <span class="required">*</span></label>
            <select class="input">
              <option>Select your gender</option>
              <option>Male</option>
              <option>Female</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label class="field-label">Mobile Number <span class="required">*</span></label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.68 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0 1 22 16.92z"/></svg>
            <input class="input" type="tel" placeholder="Enter your mobile number">
          </div>
        </div>

        <div class="field">
          <label class="field-label">Email <span class="required">*</span></label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
            <input class="input" type="email" placeholder="Enter your email">
          </div>
        </div>

        <div class="field">
          <label class="field-label">Password <span class="required">*</span></label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="input" type="password" placeholder="Enter your password">
          </div>
        </div>

        <div class="field">
          <label class="field-label">Confirm Password <span class="required">*</span></label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="input" type="password" placeholder="Confirm your password">
          </div>
        </div>

        <div class="field">
          <label class="checkbox-row"><input type="checkbox"> I agree to the Terms &amp; Conditions and Privacy Policy.</label>
        </div>

        <button class="btn btn-primary" style="width:100%;">Sign Up</button>

        <p class="text-sm mt-3" style="text-align:center;">
          Already have an account? <a href="login.html">Login here</a>
        </p>
      </div>
    </div>
  </div>

    <!-- FOOTER — dynamically loaded from partials/footer.html so it stays
       identical everywhere; edit sirf ek jagah (partials/footer.html) -->
  <div id="footer-placeholder"></div>
  <script>
    fetch('partials/footer.html')
      .then(res => res.text())
      .then(html => { document.getElementById('footer-placeholder').innerHTML = html; })
      .catch(err => console.error('Footer load failed:', err));
  </script>

</body>
</html>
